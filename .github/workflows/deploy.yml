name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # full history, the sitemap takes lastmod from git log
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (static pre-render)
        run: npm run build

      # /404.html itself answers 200, noindex keeps it from showing up as soft 404
      - name: SPA fallback for unknown routes
        run: sed 's|<head>|<head><meta name="robots" content="noindex">|' dist/index.html > dist/404.html

      # tools.html only answers /tools, /tools/ would 404. A copy as
      # tools/index.html fixes that, /tools still gets the flat file (no redirect).
      - name: Trailing-slash twins
        run: |
          cd dist
          find . -name '*.html' ! -name 'index.html' ! -name '404.html' > /tmp/pages.txt
          while IFS= read -r f; do
            d="${f%.html}"
            mkdir -p "$d"
            cp "$f" "$d/index.html"
          done < /tmp/pages.txt
          test -f tools/index.html && test -f de/index.html && test -f works/mine/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # IndexNow for Bing and co., Google only reads the sitemap
  indexnow:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Regenerate sitemap (same lastmod as the deployed one)
        run: node scripts/generate-sitemap.mjs
      - name: Submit changed URLs
        run: node scripts/indexnow.mjs
