<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Security hardening. GitHub Pages cannot send HTTP headers, so the CSP
         lives in a meta tag. Everything is self-hosted (fonts, images, JS),
         so only 'self' plus the SSG's inline scripts/styles are allowed;
         ws: keeps Vite dev-server HMR working and is harmless in production.
         Two deliberate frame-src exceptions, both click-to-load:
           - https://rappde.github.io: the browser tools on /tools. The iframe
             has no src until a tool is picked (see pages/Tools.tsx), so
             nothing is requested from github.io before then.
           - https://www.youtube-nocookie.com: the /mosh_unit install & usage
             tutorial is a click-to-load embed (see VideoEmbed.tsx). Nothing is
             framed until the visitor clicks play; the poster is self-hosted, so
             youtube is never contacted before then. img-src stays 'self' (no
             img.youtube.com), so youtube-nocookie is the only added domain. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' ws:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-src https://rappde.github.io https://www.youtube-nocookie.com"
    />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <!-- Favicons & share assets (placeholders generated from the glitch signature
         via `npm run gen:assets`; final set to be supplied by Demien — §9b). -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#FFFFFF" />
    <meta name="color-scheme" content="light" />

    <meta name="google-site-verification" content="t8_tD1L_p0x3-C9pL8I-jF6X-O8N0y3V1O3P1HhWfD6" />

    <!-- Title and meta description are injected per route via react-helmet-async
         (see src/components/Seo.tsx) so each language gets its own. -->
  </head>
  <body>
    <!-- Sprache automatisch: Wer im Browser Deutsch als bevorzugte Sprache hat,
         landet beim ersten Aufruf auf der deutschen Fassung der Seite (falls es
         eine gibt). Es gibt keinen Umschalter. Nur in diese Richtung, nie von
         /de weg: Googlebot kommt ohne Deutsch-Einstellung und muss /de trotzdem
         lesen koennen, sonst verschwindet die deutsche Fassung aus der Suche.
         Seiten ohne deutsche Fassung (Tools, Datamoshing-Artikel) bleiben. -->
    <script>
      ;(function () {
        try {
          var p = location.pathname.replace(/\/+$/, '') || '/'
          if (!/^(\/|\/about|\/mosh_unit|\/works\/[a-z-]+)$/.test(p)) return
          var langs = navigator.languages || [navigator.language || '']
          for (var i = 0; i < langs.length; i++) {
            if (/^de/i.test(langs[i])) {
              location.replace((p === '/' ? '/de' : '/de' + p) + location.hash)
              return
            }
            if (/^en/i.test(langs[i])) return
          }
        } catch (e) { /* dann bleibt es bei Englisch */ }
      })()
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
