<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- GitHub Pages can't send headers, so the CSP goes in a meta tag.
         ws: is only for Vite HMR. The two frame-src hosts (tools on /tools,
         youtube-nocookie on /mosh_unit) are only loaded after a click. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' ws:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-src https://rappde.github.io https://www.youtube-nocookie.com"
    />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <!-- generated with `npm run gen:assets` -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />

    <meta name="google-site-verification" content="t8_tD1L_p0x3-C9pL8I-jF6X-O8N0y3V1O3P1HhWfD6" />

    <!-- title and description come per route from react-helmet-async -->
  </head>
  <body>
    <!-- Browser auf Deutsch: weiter nach /de. Nur in diese Richtung, sonst
         kaeme Googlebot (ohne Deutsch) nie an die deutsche Fassung. -->
    <script>
      ;(function () {
        try {
          var p = location.pathname.replace(/\/+$/, '') || '/'
          if (!/^(\/|\/mosh_unit)$/.test(p)) return
          var langs = navigator.languages || [navigator.language || '']
          for (var i = 0; i < langs.length; i++) {
            if (/^de/i.test(langs[i])) {
              location.replace((p === '/' ? '/de' : '/de' + p) + location.hash)
              return
            }
            if (/^en/i.test(langs[i])) return
          }
        } catch (e) { /* dann bleibt es bei Englisch */ }
      })()
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
